<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title>Mansfield — White-label AI automation & web development for agencies</title>
<meta name="description" data-i18n-meta content="Mansfield builds AI automations and websites, white-labeled for your marketing agency. You sell it, we build it under your brand.">

<meta property="og:title" data-i18n-og-title content="Mansfield — White-label AI automation & web development for agencies">
<meta property="og:description" data-i18n-og-desc content="Stop turning down technical requests from your clients. You sell it, we build it under your brand.">
<meta property="og:type" content="website">
<meta property="og:locale" data-i18n-og-locale content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" data-i18n-og-title content="Mansfield — White-label AI automation & web development for agencies">
<meta name="twitter:description" data-i18n-og-desc content="Stop turning down technical requests from your clients. You sell it, we build it under your brand.">

<style>
  :root{
    --accent:#3B5BFD;
    --accent-dark:#2A44D6;
    --bg:#ffffff;
    --bg-soft:#F7F8FB;
    --text:#12141C;
    --text-soft:#565B6B;
    --border:#E7E9F0;
    --radius:14px;
    --max-w:1080px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--text);
    background:var(--bg);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;}

  .wrap{
    max-width:var(--max-w);
    margin:0 auto;
    padding:0 24px;
  }

  /* Header */
  header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,255,255,0.9);
    backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    max-width:var(--max-w);
    margin:0 auto;
  }
  .wordmark{
    font-size:20px;
    font-weight:700;
    letter-spacing:-0.02em;
    text-decoration:none;
    color:var(--text);
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .lang-toggle{
    display:flex;
    border:1px solid var(--border);
    border-radius:999px;
    overflow:hidden;
    font-size:13px;
    font-weight:600;
  }
  .lang-toggle button{
    border:none;
    background:transparent;
    padding:6px 12px;
    cursor:pointer;
    color:var(--text-soft);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
  }
  .lang-toggle button.active{
    background:var(--accent);
    color:#fff;
  }

  .btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    padding:11px 20px;
    border-radius:999px;
    font-size:14px;
    border:none;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s ease, transform .15s ease;
    white-space:nowrap;
  }
  .btn:hover{background:var(--accent-dark);}
  .btn:active{transform:scale(0.98);}
  .btn-lg{padding:15px 28px;font-size:16px;}
  .btn-outline{
    background:transparent;
    color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .btn-outline:hover{background:var(--bg-soft);}

  header .btn{padding:9px 18px;font-size:13.5px;}

  /* Hero */
  .hero{
    position:relative;
    padding:160px 24px 140px;
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    isolation:isolate;
  }
  .hero-bg-video{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(10,12,20,0.55);
    z-index:-1;
  }
  .hero h1{
    font-size:clamp(32px, 5.5vw, 52px);
    line-height:1.12;
    letter-spacing:-0.02em;
    margin:0 0 20px;
    font-weight:800;
    max-width:820px;
    margin-left:auto;
    margin-right:auto;
    color:#fff;
  }
  .hero p{
    font-size:clamp(16px, 2.2vw, 19px);
    color:rgba(255,255,255,0.85);
    max-width:600px;
    margin:0 auto 32px;
  }

  section{padding:64px 24px;}
  .section-inner{max-width:var(--max-w);margin:0 auto;}
  h2{
    font-size:clamp(24px,3.5vw,34px);
    letter-spacing:-0.01em;
    margin:0 0 40px;
    text-align:center;
    font-weight:800;
  }

  /* Services */
  .services-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
  }
  .card{
    background:var(--bg-soft);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px 24px;
  }
  .card-icon{
    width:40px;
    height:40px;
    border-radius:10px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:16px;
    color:#fff;
  }
  .card h3{
    font-size:17px;
    margin:0 0 8px;
    font-weight:700;
  }
  .card p{
    font-size:14.5px;
    color:var(--text-soft);
    margin:0;
  }

  /* How it works */
  .steps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:28px;
  }
  .step{
    text-align:center;
  }
  .step-num{
    width:36px;
    height:36px;
    border-radius:50%;
    border:2px solid var(--accent);
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    margin:0 auto 16px;
    font-size:15px;
  }
  .step p{
    font-size:15px;
    color:var(--text-soft);
    margin:0;
    max-width:260px;
    margin-left:auto;
    margin-right:auto;
  }

  /* Final CTA */
  .final-cta{
    background:var(--bg-soft);
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    text-align:center;
  }
  .final-cta h2{margin-bottom:24px;}
  .final-cta-inner{max-width:560px;margin:0 auto;}

  /* Footer */
  footer{
    padding:40px 24px;
    text-align:center;
    color:var(--text-soft);
    font-size:14px;
  }
  footer .footer-inner{
    max-width:var(--max-w);
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  footer a{
    color:var(--text-soft);
    text-decoration:underline;
  }
  footer a:hover{color:var(--accent);}

  @media (max-width:760px){
    .services-grid,.steps{grid-template-columns:1fr;}
    .hero{padding:100px 20px 80px;min-height:70vh;}
    section{padding:48px 20px;}
    .header-inner{padding:14px 20px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="#" class="wordmark">Mansfield</a>
    <div class="header-actions">
      <div class="lang-toggle" role="group" aria-label="Language toggle">
        <button type="button" data-lang-btn="en">EN</button>
        <button type="button" data-lang-btn="es">ES</button>
      </div>
      <a class="btn" href="https://calendar.app.google/UDKoDzUFanfUqB5z9" data-i18n="nav_cta"></a>
    </div>
  </div>
</header>

<section class="hero">
  <video class="hero-bg-video" autoplay muted playsinline preload="auto">
    <source src="resources/video2_loop.mp4" type="video/mp4">
  </video>
  <div class="wrap">
    <h1 data-i18n="hero_headline"></h1>
    <p data-i18n="hero_subheadline"></p>
    <a class="btn btn-lg" href="https://calendar.app.google/UDKoDzUFanfUqB5z9" data-i18n="hero_cta"></a>
  </div>
</section>

<section id="services">
  <div class="section-inner">
    <h2 data-i18n="services_title"></h2>
    <div class="services-grid">
      <div class="card">
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        </div>
        <h3 data-i18n="service1_title"></h3>
        <p data-i18n="service1_desc"></p>
      </div>
      <div class="card">
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </div>
        <h3 data-i18n="service2_title"></h3>
        <p data-i18n="service2_desc"></p>
      </div>
      <div class="card">
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/></svg>
        </div>
        <h3 data-i18n="service3_title"></h3>
        <p data-i18n="service3_desc"></p>
      </div>
    </div>
  </div>
</section>

<section id="how" style="background:var(--bg-soft);border-top:1px solid var(--border);border-bottom:1px solid var(--border);">
  <div class="section-inner">
    <h2 data-i18n="how_title"></h2>
    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <p data-i18n="how_step1"></p>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <p data-i18n="how_step2"></p>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <p data-i18n="how_step3"></p>
      </div>
    </div>
  </div>
</section>

<section class="final-cta">
  <div class="section-inner final-cta-inner">
    <h2 data-i18n="final_cta_title"></h2>
    <a class="btn btn-lg" href="https://calendar.app.google/UDKoDzUFanfUqB5z9" data-i18n="final_cta_button"></a>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div data-i18n="footer_founder"></div>
    <div><a href="mailto:emilio@getmansfield.com">hello@getmansfield.com</a></div>
  </div>
</footer>

<script>
(function(){
  var translations = {
    en: {
      nav_cta: "Book a call",
      hero_headline: "AI automations and websites, white-labeled for your agency.",
      hero_subheadline: "Stop turning down technical requests from your clients. You sell it, we build it under your brand.",
      hero_cta: "Book a 15-min call",
      services_title: "Services",
      service1_title: "Lead recovery",
      service1_desc: "Automatically follow up with missed and cold leads (GoHighLevel, HubSpot, Zapier).",
      service2_title: "AI assistants",
      service2_desc: "Chatbots trained on your client's own business info.",
      service3_title: "Websites",
      service3_desc: "Fast, conversion-focused sites delivered under your brand.",
      how_title: "How it works",
      how_step1: "Your client asks for something you don't do in-house.",
      how_step2: "You pass it to us.",
      how_step3: "We deliver it under your brand. Your client never knows we exist.",
      final_cta_title: "Have a client request you had to turn down? Let's talk.",
      final_cta_button: "Book a 15-min call",
      footer_founder: "Mansfield",
      html_lang: "en",
      title: "Mansfield — White-label AI automation & web development for agencies",
      meta_desc: "Mansfield builds AI automations and websites, white-labeled for your marketing agency. You sell it, we build it under your brand.",
      og_title: "Mansfield — White-label AI automation & web development for agencies",
      og_desc: "Stop turning down technical requests from your clients. You sell it, we build it under your brand.",
      og_locale: "en_US"
    },
    es: {
      nav_cta: "Agendar llamada",
      hero_headline: "Automatizaciones con IA y sitios web, con tu marca de agencia.",
      hero_subheadline: "Deja de rechazar solicitudes técnicas de tus clientes. Tú lo vendes, nosotros lo construimos bajo tu marca.",
      hero_cta: "Agenda una llamada de 15 min",
      services_title: "Servicios",
      service1_title: "Recuperación de leads",
      service1_desc: "Seguimiento automático de leads perdidos y fríos (GoHighLevel, HubSpot, Zapier).",
      service2_title: "Asistentes con IA",
      service2_desc: "Chatbots entrenados con la información del negocio de tu cliente.",
      service3_title: "Sitios web",
      service3_desc: "Sitios rápidos y enfocados en conversión, entregados bajo tu marca.",
      how_title: "Cómo funciona",
      how_step1: "Tu cliente pide algo que no haces internamente.",
      how_step2: "Nos lo pasas a nosotros.",
      how_step3: "Lo entregamos bajo tu marca. Tu cliente nunca sabe que existimos.",
      final_cta_title: "¿Tienes una solicitud de cliente que tuviste que rechazar? Hablemos.",
      final_cta_button: "Agenda una llamada de 15 min",
      footer_founder: "Mansfield — fundado por Emilio",
      html_lang: "es",
      title: "Mansfield — Automatización con IA y desarrollo web de marca blanca para agencias",
      meta_desc: "Mansfield construye automatizaciones con IA y sitios web de marca blanca para tu agencia de marketing. Tú lo vendes, nosotros lo construimos bajo tu marca.",
      og_title: "Mansfield — Automatización con IA y desarrollo web de marca blanca para agencias",
      og_desc: "Deja de rechazar solicitudes técnicas de tus clientes. Tú lo vendes, nosotros lo construimos bajo tu marca.",
      og_locale: "es_ES"
    }
  };

  function detectLang(){
    var saved = null;
    try { saved = localStorage.getItem('mansfield_lang'); } catch(e){}
    if(saved === 'en' || saved === 'es') return saved;
    var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    return nav.indexOf('es') === 0 ? 'es' : 'en';
  }

  function applyLang(lang){
    var t = translations[lang] || translations.en;
    document.documentElement.setAttribute('lang', t.html_lang);
    document.title = t.title;

    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(t[key] !== undefined) el.textContent = t[key];
    });

    var metaDesc = document.querySelector('[data-i18n-meta]');
    if(metaDesc) metaDesc.setAttribute('content', t.meta_desc);

    document.querySelectorAll('[data-i18n-og-title]').forEach(function(el){
      el.setAttribute('content', t.og_title);
    });
    document.querySelectorAll('[data-i18n-og-desc]').forEach(function(el){
      el.setAttribute('content', t.og_desc);
    });
    var ogLocale = document.querySelector('[data-i18n-og-locale]');
    if(ogLocale) ogLocale.setAttribute('content', t.og_locale);

    document.querySelectorAll('[data-lang-btn]').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang-btn') === lang);
    });

    try { localStorage.setItem('mansfield_lang', lang); } catch(e){}
  }

  document.querySelectorAll('[data-lang-btn]').forEach(function(btn){
    btn.addEventListener('click', function(){
      applyLang(btn.getAttribute('data-lang-btn'));
    });
  });

  applyLang(detectLang());
})();
</script>

</body>
</html>
